<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#23463A"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><script src="config.js?v=2"></script></head><body>
<title>החתונה של אורי ויובל</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: a planner's binder. A deep eucalyptus header band with the couple's names, a sticky tab strip, then one working sheet per tab. */
:root{
  --bg:#F5F7F3; --surface:#FFFFFF; --ink:#1D2B24; --muted:#5C6C64; --line:#DCE3DD; --soft:#EAF0EB;
  --accent:#2D5A49; --accent-ink:#FFFFFF; --gold:#A57A2E; --gold-soft:#F4EBDA;
  --good:#2B7A4B; --good-soft:#E3F2E8; --warn:#A86A12; --warn-soft:#FBF0DC; --bad:#B0453A; --bad-soft:#F8E4E1;
  --band:#23463A; --band-ink:#F3F6F2; --band-muted:#B9CCC2;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.05);
  --f-display:"Frank Ruhl Libre","David","Times New Roman",serif;
  --f-body:"Assistant","Segoe UI","Arial Hebrew",Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101714; --surface:#17211D; --ink:#E6EDE8; --muted:#9BACA3; --line:#2A3832; --soft:#1E2B26;
  --accent:#86C2A6; --accent-ink:#0E1A15; --gold:#DDB46B; --gold-soft:#2E2718;
  --good:#71C694; --good-soft:#18301F; --warn:#E6AE55; --warn-soft:#33270F; --bad:#EA8478; --bad-soft:#381D1A;
  --band:#0C1411; --band-ink:#EEF3EF; --band-muted:#8FA79A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101714; --surface:#17211D; --ink:#E6EDE8; --muted:#9BACA3; --line:#2A3832; --soft:#1E2B26;
  --accent:#86C2A6; --accent-ink:#0E1A15; --gold:#DDB46B; --gold-soft:#2E2718;
  --good:#71C694; --good-soft:#18301F; --warn:#E6AE55; --warn-soft:#33270F; --bad:#EA8478; --bad-soft:#381D1A;
  --band:#0C1411; --band-ink:#EEF3EF; --band-muted:#8FA79A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header band */
.hero{background:var(--band) radial-gradient(circle at 8% 120%,transparent 90px,rgba(255,255,255,.05) 91px,rgba(255,255,255,.05) 92px,transparent 93px,transparent 120px,rgba(255,255,255,.035) 121px,rgba(255,255,255,.035) 122px,transparent 123px);color:var(--band-ink);margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 22px);padding-bottom:20px;position:relative;z-index:25}
.hero-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;position:relative;z-index:1}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--band-muted);font-weight:700}
.names{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,7vw,56px);line-height:1.05;margin:4px 0 6px;text-wrap:balance}
.names .amp{color:var(--gold);font-weight:500;padding:0 .12em}
.meta{color:var(--band-muted);font-size:15px;display:flex;flex-wrap:wrap;gap:4px 14px}
.count{display:flex;align-items:baseline;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);padding:10px 16px;border-radius:14px}
.count b{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--gold)}
.count span{color:var(--band-muted);font-size:14px}
.count button{background:none;border:0;color:var(--band-ink);text-decoration:underline;cursor:pointer;padding:0}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;padding:13px 14px 11px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

main{padding-block:20px 60px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);color:var(--ink);padding:10px 14px;border-radius:var(--r);margin-bottom:16px;font-size:14px}
.banner b{color:var(--gold)}
h2{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;text-wrap:balance}
h3{font-size:16px;margin:0 0 10px;font-weight:800}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sub{color:var(--muted);font-size:14px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:860px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.tile .lbl{font-size:13px;color:var(--muted);font-weight:700}
.tile .val{font-size:28px;font-weight:800;line-height:1.15;margin-top:2px}
.tile .foot{font-size:13px;color:var(--muted);margin-top:4px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over i{background:var(--bad)}
.bar.gold i{background:var(--gold)}
.pos{color:var(--good)} .neg{color:var(--bad)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.icon-btn{border:0;background:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--muted)}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search],.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-width:0}
.toolbar input[type=search]{flex:1 1 200px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-yes{background:var(--good-soft);color:var(--good)} .p-no{background:var(--bad-soft);color:var(--bad)}
.p-pending{background:var(--soft);color:var(--muted)} .p-maybe{background:var(--warn-soft);color:var(--warn)}
.p-est{background:var(--gold-soft);color:var(--gold)}
.tag{font-size:12px;color:var(--muted);background:var(--soft);padding:1px 8px;border-radius:6px}

/* Guests */
.glist{display:flex;flex-direction:column;gap:8px}
.grow{display:grid;grid-template-columns:minmax(0,1.6fr) auto auto auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.grow .who{min-width:0}
.grow .nm{font-weight:800;cursor:pointer;background:none;border:0;padding:0;text-align:right;font-size:16px}
.grow .nm:hover{color:var(--accent);text-decoration:underline}
.grow .info{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.grow .info a{color:var(--accent);font-weight:700;text-decoration:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button.on-yes{background:var(--good);color:#fff}.seg button.on-maybe{background:var(--warn);color:#fff}.seg button.on-no{background:var(--bad);color:#fff}
.stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:10px}
.stepper button{border:0;background:none;width:30px;height:30px;cursor:pointer;font-size:17px;font-weight:800;color:var(--accent)}
.stepper span{min-width:46px;text-align:center;font-weight:800;font-size:14px}
.stepper span small{color:var(--muted);font-weight:600}
@media (max-width:700px){.grow{grid-template-columns:minmax(0,1fr) auto;row-gap:8px}.grow .seg{grid-column:1}.grow .stepper{grid-column:2;justify-self:end}.grow .tbl{display:none}}

/* Vendors */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.vcard{cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:right;font:inherit}
.vcard:hover{border-color:var(--accent)}
.vcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.vcard .cat{font-weight:800;font-size:16px}
.vcard .vn{font-size:13px;color:var(--muted)}
.vcard .price{font-size:22px;font-weight:800}
.vcard .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.vcard.plates{background:var(--soft);border-color:transparent}

/* Breakdown bars */
.brk{display:flex;flex-direction:column;gap:9px}
.brk .r{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.brk .r .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brk .r .b{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.brk .r .b i{display:block;height:100%;background:var(--accent);border-radius:99px}
.brk .r .b i.paid{background:var(--gold)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

.lst{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lst li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.lst li:last-child{border-bottom:0}
.lst li .grow1{flex:1;min-width:0}
.lst .muted{color:var(--muted);font-size:13px}

/* Tasks */
.phase{margin-bottom:18px}
.phase h3{display:flex;justify-content:space-between;align-items:center;color:var(--accent)}
.task{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.task input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto;cursor:pointer}
.task .tt{flex:1;min-width:0;cursor:pointer}
.task.done .tt{text-decoration:line-through;color:var(--muted)}

/* Day timeline */
.tl{position:relative;padding-inline-start:26px}
.tl::before{content:"";position:absolute;inset-block:6px;inset-inline-start:7px;width:2px;background:var(--line)}
.tli{position:relative;margin-bottom:12px}
.tli::before{content:"";position:absolute;inset-inline-start:-24px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--gold)}
.tli .card{display:flex;gap:14px;align-items:center;cursor:pointer;padding:12px 16px}
.tli .tm{font-weight:800;font-size:20px;color:var(--accent);min-width:58px}

.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px;font-family:var(--f-display)}

/* Settings form */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:600px){.form{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.field .hint{font-size:12px;color:var(--muted)}
.field.chk{flex-direction:row;align-items:center;gap:8px}
.field.chk input{width:20px;height:20px;accent-color:var(--accent)}

/* Sheet / modal */
.overlay{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:16px;width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet h2{font-size:22px;margin-bottom:14px}
.sheet .actions{display:flex;gap:8px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
@media (max-width:600px){.overlay{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;max-height:92%;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;background:var(--muted)}
.status-dot.ok{background:var(--good)}.status-dot.warn{background:var(--warn)}
.toolbar.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 47px);z-index:10;background:var(--bg);padding-block:8px;margin-block:-8px 4px}
.toolbar.sticky input[type=search]{font-size:16px;padding:11px 14px;border-color:var(--accent)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) auto minmax(0,1.3fr) auto;gap:8px;align-items:center;margin-bottom:8px}
.prow input{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;min-width:0;width:100%}
.prow label{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;white-space:nowrap}
.prow label input{width:18px;height:18px;accent-color:var(--accent)}
@media (max-width:600px){.prow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;padding-bottom:8px;border-bottom:1px solid var(--line)}.prow .pn{grid-column:1/3}}
.seat-layout{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:800px){.seat-layout{grid-template-columns:minmax(0,1fr)}}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tcard .th{display:flex;justify-content:space-between;align-items:baseline;gap:8px;cursor:pointer;background:none;border:0;padding:0;width:100%;text-align:right}
.tcard .th b{font-family:var(--f-display);font-size:20px}
.gchip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:8px;padding:3px 4px 3px 8px;font-size:13px;margin:4px 0 0 4px}
.gchip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 3px}
.unseat li select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 6px;max-width:130px}
.round .who{font-family:var(--f-display);font-size:28px;font-weight:700}
.round .big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.round .big .btn{justify-content:center;padding:12px}
.qadd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;margin-bottom:12px;border-style:dashed}
.qadd input,.qadd select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;min-width:0}
.qadd #qaName{flex:2 1 180px}.qadd #qaPhone{flex:1 1 120px}
.qadd .qn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:700}.qadd #qaCount{width:60px}
.tag.diet{background:var(--warn-soft);color:var(--warn)}.tag.form{background:var(--good-soft);color:var(--good)}
.evswitch{position:absolute;top:0;left:0;z-index:5}
.dots{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--band-ink);font-size:22px;line-height:1;cursor:pointer}
.dots:hover{background:rgba(255,255,255,.14)}.dots:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.evmenu{position:absolute;top:46px;left:0;min-width:200px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:6px;display:flex;flex-direction:column}
.evmenu-t{font-size:12px;color:var(--muted);font-weight:700;padding:6px 10px}
.evmenu button{display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:700;cursor:pointer;text-align:right}
.evmenu button:hover{background:var(--soft)}.evmenu button[aria-checked="true"]{color:var(--accent)}
.hero-row{padding-left:52px}
footer{color:var(--muted);font-size:12px;text-align:center;padding-block:10px 30px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}}
[hidden]{display:none!important}
.vstar{background:none;border:0;cursor:pointer;font-size:20px;line-height:1;color:var(--line);padding:2px}
.vstar.on{color:var(--gold)}
.cmpt{width:100%;border-collapse:collapse;font-size:14px}
.cmpt th,.cmpt td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.cmpt th{font-weight:700;color:var(--muted);width:34%}
.cmpt input,.cmpt select{width:100%;min-width:0;box-sizing:border-box;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.cmpt tr.tot td,.cmpt tr.tot th{font-weight:800;font-size:16px;color:var(--ink);border-bottom:0}
.cmpt .win{color:var(--good)}
.dlist{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow .dt{font-weight:800}
.drow .hd{font-size:13px;color:var(--muted)}
.drow .tm{font-size:13px;text-align:left;white-space:nowrap;color:var(--muted)}
.drow .tm b{color:var(--ink)}
.drow.chosen{background:var(--good-soft);border-radius:8px;padding-inline:8px}
</style>

<div dir="rtl" lang="he" id="app">
  <header class="hero">
    <div class="wrap hero-row">
      <div>
        <div class="eyebrow" id="hEyebrow">מתכננים חתונה</div>
        <h1 class="names" id="hNames">אורי <span class="amp">&amp;</span> יובל</h1>
        <div class="meta" id="hMeta"><span>טוען…</span></div>
      </div>
      <div class="count" id="hCount"></div>
      <div class="evswitch"><button type="button" class="dots" id="evBtn" data-act-menu="1" aria-haspopup="true" aria-expanded="false" aria-label="מעבר לאירוע אחר">⋮</button>
        <div class="evmenu" id="evMenu" hidden role="menu"></div></div>

async function put(col,id,obj){

}

const API=window.WEDDING_API||'';let apiPending=0,apiCode='';
async function apiPost(o){const res=await fetch(API,{method:'POST',body:JSON.stringify(Object.assign({code:apiCode},o))});const j=await res.json();if(!j.ok)throw {code:j.error||'failed'};return j;}

    if(STORES[ev]&&STORES[ev][col])STORES[ev][col][parts[1]]=d[path];});

async function apiLoad(first){if(apiPending)return;try{const res=await fetch(API+'?action=load&code='+encodeURIComponent(apiCode)+'&t='+Date.now());const j=await res.json();

    if(apiPending)return;if(document.getElementById('modalRoot').firstChild&&!first){return;}

  catch(e){loadNote='אין חיבור כרגע. הנתונים שמוצגים אולי לא עדכניים.';render();}}

  $('#gate').onsubmit=e=>{e.preventDefault();apiCode=$('#gateCode').value.trim();try{localStorage.setItem(LS_KEY+'-code',apiCode);}catch(x){}$('#modalRoot').innerHTML='';apiLoad(true);};setTimeout(()=>{const i=$('#gateCode');if(i)i.focus();},50);}

const loaded={};
function startSync(){

  const fail=()=>{clearTimeout(timer);loadNote='לא ניתן לטעון את הנתונים כרגע.';render();};
  const done=(k,fromCache)=>{if(!fromCache){pending.delete(k);const ev=k.split(':')[0];if(![...pending].some(x=>x.startsWith(ev+':'))){loaded[ev]=true;maybeSeed();}if(!pending.size&&!confirmed){confirmed=true;clearTimeout(timer);loadNote='';}}scheduleRender();};
  EVENTS.forEach(([ev])=>{const st=STORES[ev];
    db.doc(settingsPath(ev)).onSnapshot(sn=>{st.settings=sn.exists?sn.data():null;done(ev+':settings',sn.metadata.fromCache);},fail);
    COLS.forEach(col=>{db.collection(prefix(ev)+col).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data();});st[col]=o;done(ev+':'+col,snap.metadata.fromCache);},fail);});});
}

let rq=false;function scheduleRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render();});}

/* ---------- Calculations ---------- */
function gstats(){
  const r={invited:0,yes:0,pending:0,maybe:0,no:0,households:0,sides:{a:0,b:0,both:0}};
  Object.values(S.guests).forEach(g=>{const inv=n(g.invited)||1;r.households++;r.invited+=inv;
    if(g.status==='yes'){r.yes+=n(g.coming);} else if(g.status==='no')r.no+=inv; else if(g.status==='maybe')r.maybe+=inv; else r.pending+=inv;
    const sd=g.side==='a'?'a':g.side==='b'?'b':'both';r.sides[sd]+=(g.status==='yes'?n(g.coming):g.status==='no'?0:inv);});
  return r;
}
function headcount(){const g=gstats();return ui.calc==='confirmed'?g.yes:g.yes+g.pending+g.maybe;}
function plateCount(){return Math.max(headcount(),n(set().minPlates));}
function vcost(v){return v.mode==='perGuest'?n(v.price)*headcount():n(v.price);}
function vpaid(v){return Array.isArray(v.payments)&&v.payments.length?v.payments.reduce((a,p)=>a+(p.paid?n(p.amount):0),0):n(v.paid);}
function vnext(v){if(Array.isArray(v.payments)&&v.payments.length){const u=v.payments.filter(p=>!p.paid).sort((a,b)=>String(a.date||'9').localeCompare(String(b.date||'9')))[0];return u?{date:u.date||'',amount:n(u.amount)}:null;}return v.due?{date:v.due,amount:Math.max(0,vcost(v)-n(v.paid))}:null;}
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const shortDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('he-IL',{day:'numeric',month:'short'}):'';
function intlPhone(p){const t=String(p||'').replace(/[^\d+]/g,'');if(!t)return '';return t.startsWith('+')?t.slice(1):t.startsWith('0')?'972'+t.slice(1):t;}
function rsvpLink(id){if(mode==='api'){const base=location.href.split(/[?#]/)[0].replace(/index\.html$/,'');return base+'rsvp.html?e='+cur+(id?'&g='+id:'');}return set().formUrl||'';}
function rsvpText(g,id){const s=set();const [a,b]=names();const date=s.date?new Date(s.date+'T00:00:00').toLocaleDateString('he-IL',{day:'numeric',month:'long'}):'';
  return String(s.rsvpMsg||DEFAULT_MSG).replace(/\{שם\}/g,g.name||'').replace(/\{זוג\}/g,a+' ו'+b).replace(/ ?ב?\{תאריך\}/g,date?' ב'+date:'').replace(/ ?ב?\{מקום\}/g,s.venue?' ב'+s.venue:'').replace(/\{קישור\}/g,rsvpLink(id)||'(קישור לאישור הגעה)').replace(/ {2,}/g,' ');}
function wazeLink(){const s=set();const q=s.address||s.venue;return q?'https://waze.com/ul?q='+encodeURIComponent(q)+'&navigate=yes':'';}
function fillMsg(tpl,g,id){const s=set();const [a,b]=names();const date=s.date?' ב־'+new Date(s.date+'T00:00:00').toLocaleDateString('he-IL',{day:'numeric',month:'long'}):'';
  return String(tpl).replace(/\{שם\}/g,g.name||'').replace(/\{זוג\}/g,a+' ו'+b).replace(/\{לאירוע\}/g,evTo()).replace(/\{תאריך\}/g,date)
   .replace(/\{שעה\}/g,s.time?'קבלת פנים ב־'+s.time:'').replace(/\{מקום\}/g,(s.venue?(s.time?', ':'')+s.venue:'')+(s.address&&s.address!==s.venue?' ('+s.address+')':''))
   .replace(/\{וויז\}/g,wazeLink()||'(חסרה כתובת בהגדרות)').replace(/\{קישור\}/g,rsvpLink(id)||'(קישור לאישור הגעה)').replace(/[ \t]{2,}/g,' ').replace(/\n{3,}/g,'\n\n');}
function roundText(kind,g,id){const s=set();if(kind==='remind')return fillMsg(s.remindMsg||REMIND_MSG,g,id);if(kind==='day')return fillMsg(s.dayMsg||DAY_MSG,g,id);return rsvpText(g,id);}
function waLink(g,id,kind){if(kind&&kind!=='invite'){return 'https://wa.me/'+intlPhone(g.phone)+'?text='+encodeURIComponent(roundText(kind,g,id));}const t=intlPhone(g.phone);return 'https://wa.me/'+t+'?text='+encodeURIComponent(rsvpText(g,id));}
function totals(){
  const plates=plateCount()*n(set().platePrice);
  let vend=0,paid=n(set().venuePaid),est=0;
  Object.values(S.vendors).forEach(v=>{const c=vcost(v);vend+=c;paid+=vpaid(v);if(v.status!=='booked')est+=c;});
  const total=plates+vend;const gifts=Object.values(S.gifts).reduce((a,g)=>a+n(g.amount),0);
  return {plates,vend,total,paid,remaining:Math.max(0,total-paid),est,gifts,budget:n(set().budget)};
}
function daysLeft(){const d=set().date;if(!d)return null;const t=new Date(d+'T00:00:00');const now=new Date();now.setHours(0,0,0,0);return Math.round((t-now)/864e5);}
function sortedVendors(){return Object.entries(S.vendors).sort((a,b)=>(n(a[1].order)-n(b[1].order))||String(a[1].cat).localeCompare(b[1].cat,'he'));}

function guestRows(){
  const q=ui.q.trim().toLowerCase();
  return Object.entries(S.guests).filter(([id,g])=>{
    if(ui.gStatus!=='all'&&(g.status||'pending')!==ui.gStatus)return false;
    if(ui.gSide!=='all'&&(g.side||'both')!==ui.gSide)return false;
    if(ui.gGroup!=='all'&&(ui.gGroup==='__form'?g.source!=='form':(g.group||'')!==ui.gGroup))return false;
    if(q&&!((g.name||'')+' '+(g.phone||'')+' '+(g.group||'')+' '+(g.note||'')+' '+(g.table||'')+' '+(g.diet||'')).toLowerCase().includes(q)&&!(q.replace(/\D/g,'').length>3&&String(g.phone||'').replace(/\D/g,'').includes(q.replace(/\D/g,''))))return false;
    return true;}).sort((a,b)=>{const A=a[1],B=b[1];const byName=String(A.name).localeCompare(String(B.name),'he');
      if(ui.sort==='status'){const o={yes:0,maybe:1,pending:2,no:3};return (o[A.status||'pending']-o[B.status||'pending'])||byName;}
      if(ui.sort==='recent')return n(B.updatedAt)-n(A.updatedAt)||byName;
      if(ui.sort==='side'){const o={a:0,b:1,both:2};return (o[A.side||'both']-o[B.side||'both'])||byName;}
      if(ui.sort==='group')return String(A.group||'ת').localeCompare(String(B.group||'ת'),'he')||byName;
      return byName;});
}

function openForm(title,fields,vals,onSave,onDelete,extra){
  const root=$('#modalRoot');
  const f=fields.map(x=>{
    const v=vals[x.k]!=null?vals[x.k]:(x.def!=null?x.def:'');const id='m_'+x.k;
    if(x.type==='select')return '<div class="field'+(x.full?' full':'')+'"><label for="'+id+'">'+x.label+'</label><select id="'+id+'" name="'+x.k+'">'+x.options.map(([ov,ol])=>'<option value="'+esc(ov)+'"'+(String(v)===String(ov)?' selected':'')+'>'+esc(ol)+'</option>').join('')+'</select></div>';
    if(x.type==='textarea')return '<div class="field full"><label for="'+id+'">'+x.label+'</label><textarea id="'+id+'" name="'+x.k+'" rows="'+(x.rows||3)+'" placeholder="'+esc(x.ph||'')+'">'+esc(v)+'</textarea>'+(x.hint?'<span class="hint">'+x.hint+'</span>':'')+'</div>';
    if(x.type==='checkbox')return '<div class="field chk'+(x.full?' full':'')+'"><input type="checkbox" id="'+id+'" name="'+x.k+'"'+(v?' checked':'')+'><label for="'+id+'">'+x.label+'</label></div>';
    return '<div class="field'+(x.full?' full':'')+'"><label for="'+id+'">'+x.label+'</label><input id="'+id+'" name="'+x.k+'" type="'+(x.type||'text')+'" value="'+esc(v)+'"'+(x.type==='number'?' inputmode="decimal" min="0" step="any"':'')+(x.list?' list="'+x.list+'"':'')+' placeholder="'+esc(x.ph||'')+'"'+(x.req?' required':'')+'>'+(x.hint?'<span class="hint">'+x.hint+'</span>':'')+'</div>';
  }).join('');
  root.innerHTML='<div class="overlay" dir="rtl"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h2>'+esc(title)+'</h2><form class="form" id="mform">'+f+(extra||'')+'</form><div class="actions"><div>'+(onDelete?'<button type="button" class="btn danger" id="mdel">מחיקה</button>':'')+'</div><div class="chips"><button type="button" class="btn" id="mcancel">ביטול</button><button type="submit" form="mform" class="btn primary">שמירה</button></div></div></div></div>';
  const ov=root.firstChild;
  closeModal=()=>{root.innerHTML='';document.removeEventListener('keydown',onKey);};
  const onKey=e=>{if(e.key==='Escape')closeModal();};document.addEventListener('keydown',onKey);
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});
  $('#mcancel').onclick=closeModal;
  $('#mform').onsubmit=e=>{e.preventDefault();const o={};fields.forEach(x=>{const el=document.getElementById('m_'+x.k);o[x.k]=x.type==='checkbox'?el.checked:x.type==='number'?n(el.value):el.value.trim();});closeModal();onSave(o);};
  if(onDelete){const b=$('#mdel');b.onclick=()=>{if(b.classList.contains('armed')){closeModal();onDelete();}else{b.classList.add('armed');b.textContent='בטוח? לחצו שוב';}};}
  const first=root.querySelector('input,select,textarea');if(first&&window.innerWidth>600)first.focus();
}

const seatN=g=>g.status==='yes'?n(g.coming):(n(g.invited)||1);
function sortedTables(){return Object.entries(S.tables).sort((a,b)=>(n(a[1].num)-n(b[1].num))||String(a[1].num).localeCompare(String(b[1].num)));}
function vSeating(){
  const tables=sortedTables();const keys=new Set(tables.map(([i,t])=>String(t.num)));
  const guests=Object.entries(S.guests).filter(([i,g])=>g.status!=='no');
  const seated=guests.filter(([i,g])=>g.table&&keys.has(String(g.table)));
  const unseated=guests.filter(([i,g])=>!(g.table&&keys.has(String(g.table)))).sort((a,b)=>String(a[1].name).localeCompare(String(b[1].name),'he'));
  const cap=tables.reduce((a,[i,t])=>a+n(t.cap),0);const sN=seated.reduce((a,[i,g])=>a+seatN(g),0);const uN=unseated.reduce((a,[i,g])=>a+seatN(g),0);
  let h=banners();
  h+='<div class="sec-head"><div><h2>סידורי הושבה</h2><div class="sub num">'+tables.length+' שולחנות · '+fmt.format(cap)+' מקומות · '+fmt.format(sN)+' הושבו · '+fmt.format(uN)+' עוד בלי שולחן</div></div><div class="chips"><button class="btn" type="button" data-act="addTables">הוספת כמה שולחנות</button><button class="btn primary" type="button" data-act="addTable">+ שולחן</button></div></div>';
  if(!tables.length)return h+'<div class="card empty"><b>עוד אין שולחנות</b>הוסיפו את השולחנות של האולם, ואז שבצו כל מוזמן לשולחן. מי שאמר שלא מגיע לא מופיע כאן.<div style="margin-top:12px"><button class="btn primary" type="button" data-act="addTables">הוספת שולחנות</button></div></div>';
  const opts=tables.map(([i,t])=>{const c=guests.filter(([x,g])=>String(g.table)===String(t.num)).reduce((a,[x,g])=>a+seatN(g),0);return '<option value="'+esc(t.num)+'">'+esc(t.num)+(t.name?' · '+esc(t.name):'')+' ('+c+'/'+n(t.cap)+')</option>';}).join('');
  h+='<div class="seat-layout"><div class="card unseat"><h3>בלי שולחן <span class="sub num">('+fmt.format(uN)+')</span></h3>'+(unseated.length?'<ul class="lst">'+unseated.map(([id,g])=>'<li><span class="grow1"><b>'+esc(g.name)+'</b> <span class="muted num">'+seatN(g)+'</span> <span class="pill p-'+(g.status||'pending')+'">'+STATUS[g.status||'pending']+'</span></span><select data-seat="'+id+'" aria-label="שולחן ל'+esc(g.name)+'"><option value="">שולחן…</option>'+opts+'</select></li>').join('')+'</ul>':'<div class="sub">כולם הושבו 👏</div>')+'</div>';
  h+='<div class="tgrid">'+tables.map(([tid,t])=>{const gs=guests.filter(([i,g])=>String(g.table)===String(t.num));const c=gs.reduce((a,[i,g])=>a+seatN(g),0);const over=c>n(t.cap);
    return '<div class="card tcard"><button type="button" class="th" data-edit-table="'+tid+'"><b>שולחן '+esc(t.num)+'</b><span class="num '+(over?'neg':'sub')+'">'+c+'/'+n(t.cap)+'</span></button>'+(t.name?'<div class="sub">'+esc(t.name)+'</div>':'')+'<div class="bar '+(over?'over':'')+'"><i style="width:'+(n(t.cap)?Math.min(100,c/n(t.cap)*100):0)+'%"></i></div><div style="margin-top:6px">'+gs.map(([i,g])=>'<span class="gchip">'+esc(g.name)+' <span class="num">'+seatN(g)+'</span><button type="button" data-unseat="'+i+'" aria-label="הוצאה מהשולחן">×</button></span>').join('')+'</div></div>';}).join('')+'</div></div>';
  return h;
}

function infoModal(title,html){$('#modalRoot').innerHTML='<div class="overlay" dir="rtl"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h2>'+esc(title)+'</h2>'+html+'<div class="actions"><div></div><button type="button" class="btn primary" data-mclose>סגירה</button></div></div></div>';
  const ov=$('#modalRoot').firstChild;ov.addEventListener('click',e=>{if(e.target===ov||e.target.dataset.mclose!=null)$('#modalRoot').innerHTML='';});}
const waiting=g=>(g.status||'pending')==='pending'||g.status==='maybe';
function summaryText(){const s=set();const [a,b]=names();const g=gstats();const ys=Object.values(S.guests).filter(x=>x.status==='yes');
  const ppl=x=>n(x.coming)||n(x.invited)||1;const by=f=>{const o={};ys.forEach(x=>{const k=f(x);if(k)o[k]=(o[k]||0)+ppl(x);});return o;};
  const side=by(x=>x.side==='a'?'הצד של '+a:x.side==='b'?'הצד של '+b:'משותף');const grp=by(x=>x.group||'');const diet={};ys.forEach(x=>{if(x.diet)diet[x.diet]=(diet[x.diet]||0)+1;});
  const L=[];L.push('סיכום '+evLabel()+' של '+a+' ו'+b+(s.date?' · '+new Date(s.date+'T00:00:00').toLocaleDateString('he-IL'):''));if(s.venue)L.push(s.venue);L.push('');
  L.push('מאשרים הגעה: '+g.yes+' אנשים ('+ys.length+' רשומות)');
  if(n(s.minPlates)&&n(s.minPlates)>g.yes)L.push('מינימום מנות באולם: '+n(s.minPlates)+' (מחייב יותר מכמות המאשרים)');
  if(g.pending+g.maybe)L.push('עוד בלי תשובה סופית: '+(g.pending+g.maybe)+' אנשים');
  const dk=Object.keys(diet);L.push('');L.push('מנות מיוחדות: '+(dk.length?dk.map(k=>k+' '+diet[k]).join(', '):'אין'));
  const rg=dk.reduce((t,k)=>t+diet[k],0);if(dk.length)L.push('מנות רגילות: '+Math.max(0,g.yes-rg));
  L.push('');L.push('לפי צד: '+Object.keys(side).map(k=>k+' '+side[k]).join(', '));
  const gk=Object.keys(grp);if(gk.length)L.push('לפי קבוצה: '+gk.map(k=>k+' '+grp[k]).join(', '));
  return L.join('\n');}
function venueSummary(){const txt=summaryText();const g=gstats();
  infoModal('סיכום לאולם','<div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px"><div class="card tile"><div class="lbl">מאשרים</div><div class="val num">'+fmt.format(g.yes)+'</div></div><div class="card tile"><div class="lbl">בלי תשובה</div><div class="val num">'+fmt.format(g.pending+g.maybe)+'</div></div></div><pre style="white-space:pre-wrap;font:inherit;background:var(--soft);padding:12px;border-radius:10px;margin:0">'+esc(txt)+'</pre><div class="chips" style="margin-top:10px"><button type="button" class="btn primary" id="sumCopy">העתקה (לשליחה לאולם)</button><a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(txt)+'">שליחה בוואטסאפ</a></div>');
  const c=$('#sumCopy');if(c)c.onclick=()=>{try{navigator.clipboard.writeText(txt).then(()=>toast('הסיכום הועתק'),()=>toast('לא הצלחתי להעתיק'));}catch(e){toast('לא הצלחתי להעתיק');}};}
function rsvpRound(kind){kind=typeof kind==='string'?kind:'invite';
  const byName=(a,b)=>String(a[1].name).localeCompare(String(b[1].name),'he');const all=Object.entries(S.guests);
  let list;if(kind==='day')list=all.filter(([i,g])=>g.status==='yes');else if(kind==='remind')list=all.filter(([i,g])=>waiting(g));else{list=all.filter(([i,g])=>waiting(g)&&!g.sentAt);if(!list.length)list=all.filter(([i,g])=>waiting(g));}
  list=list.sort(kind==='remind'?(a,b)=>(a[1].remindAt||0)-(b[1].remindAt||0)||byName(a,b):byName).map(x=>x[0]);
  const TT={invite:'סבב אישורים',remind:'תזכורת למי שלא ענה',day:'הודעה יום לפני'}[kind];
  if(!list.length){infoModal(TT,kind==='day'?'<p>עוד אין מוזמנים שאישרו הגעה.</p>':'<p>אין מוזמנים שממתינים לתשובה. כל הכבוד!</p>');return;}
  if(kind==='day'&&!wazeLink()){toast('כדאי להוסיף כתובת בהגדרות, כדי שיהיה קישור לוויז');}
  let i=0,cnt=1;const root=$('#modalRoot');const [a,b]=names();
  function draw(){
    if(i>=list.length){root.innerHTML='';toast('הסבב הסתיים');return;}
    const id=list[i];const g=S.guests[id];if(!g){i++;return draw();}
    cnt=n(g.invited)||1;
    root.innerHTML='<div class="overlay" dir="rtl"><div class="sheet round" role="dialog" aria-modal="true" aria-label="סבב אישורים"><div class="sub num">'+esc(TT)+' · '+(i+1)+' מתוך '+list.length+'</div><div class="who">'+esc(g.name)+'</div><div class="sub">'+esc(g.side==='a'?'הצד של '+a:g.side==='b'?'הצד של '+b:'משותף')+(g.phone?' · <span class="num">'+esc(g.phone)+'</span>':' · אין טלפון')+' · הוזמנו '+(n(g.invited)||1)+'</div>'
      +'<div class="chips" style="margin-top:12px">'+(g.phone?'<a class="btn primary" href="'+esc(waLink(g,id,kind))+'" target="_blank" rel="noopener" data-sent>שליחת הודעה בוואטסאפ</a>':'<span class="sub">אין טלפון. אפשר להעתיק ולשלוח ידנית.</span>')+'<button type="button" class="btn" data-copy>העתקת ההודעה</button></div>'
      +(kind==='day'?(g.remindDayAt?'<div class="sub" style="margin-top:10px">כבר נשלח</div>':''):(g.sentAt||g.remindAt?'<div class="sub" style="margin-top:10px">'+(g.remindAt?'תזכורת אחרונה: '+new Date(g.remindAt).toLocaleDateString('he-IL',{day:'numeric',month:'numeric'}):'ההזמנה נשלחה ב־'+new Date(g.sentAt).toLocaleDateString('he-IL',{day:'numeric',month:'numeric'}))+'</div>':'')
      +'<div class="sub" style="margin-top:14px">קיבלתם תשובה? כמה מגיעים:</div><div class="stepper" style="margin-top:6px"><button type="button" data-rc="-1" aria-label="פחות">−</button><span class="num" id="rcnt">'+cnt+'</span><button type="button" data-rc="1" aria-label="יותר">+</button></div>'
      +'<div class="big"><button type="button" class="btn" style="background:var(--good);color:#fff;border-color:var(--good)" data-ans="yes">מגיעים</button><button type="button" class="btn" data-ans="maybe">אולי</button><button type="button" class="btn danger" data-ans="no">לא מגיעים</button></div>')
      +'<div class="actions"><button type="button" class="btn" data-rclose>סיום</button><button type="button" class="btn" data-skip>דילוג למוזמן הבא ←</button></div></div></div>';
    const ov=root.firstChild;
    ov.addEventListener('click',e=>{const t=e.target.closest('button,a')||e.target;const d=t.dataset||{};
      if(d.sent!=null){const f={invite:'sentAt',remind:'remindAt',day:'remindDayAt'}[kind];const o=Object.assign({},S.guests[id]);o[f]=Date.now();put('guests',id,o);return;}

const GS='Google Sheets';
function findGrid(x,depth){depth=depth||0;if(depth>6||x==null)return null;
  if(typeof x==='string'){try{return findGrid(JSON.parse(x),depth+1);}catch(e){return null;}}
  if(Array.isArray(x)){if(x.length&&x.every(r=>Array.isArray(r)))return x;for(const y of x){const g=findGrid(y,depth+1);if(g)return g;}return null;}
  if(typeof x==='object'){if(Array.isArray(x.values)&&x.values.every(r=>Array.isArray(r)))return x.values;for(const k in x){const g=findGrid(x[k],depth+1);if(g)return g;}}
  return null;}
async function syncForm(){

  let props={};

  props=p||{};const keys=Object.keys(props);

  input[rKey]=(props[rKey]&&props[rKey].type==='array')?[RANGE]:RANGE;

    const msg=code==='server_not_connected'||code==='needs_reauth'?'Google Sheets לא מחובר לחשבון שלכם. חברו אותו ב-claude.ai בהגדרות ← Connectors ונסו שוב.'
      :code==='not_in_manifest'?'לא אישרתם לאפליקציה לקרוא מ-Google Sheets. אפשר לשנות את זה בתפריט ההרשאות של האפליקציה.'
      :code==='tool_error'?'גוגל לא הצליח לקרוא את הגיליון. בדקו שהקישור נכון ושיש לכם גישה אליו.'

  const grid=findGrid(res&&res.payload!==undefined?res.payload:res);

  const last9=s=>String(s||'').replace(/\D/g,'').slice(-9);

    if(hit.length===1){const [id,g]=hit[0];const o=Object.assign({},g,{status,source:'form'});if(status==='yes')o.coming=isFinite(num)&&num>0?num:(n(g.invited)||1);if(status==='no')o.coming=0;if(!o.phone&&ph)o.phone=ph;
      if(o.status!==g.status||n(o.coming)!==n(g.coming)||o.phone!==g.phone){await put('guests',id,o);upd++;}touched.add(id);}

  }
  await put('settings','main',Object.assign({},set(),{lastSync:Date.now()}));

  if(d.editTable)return tableForm(d.editTable);
  if(d.unseat){const g=S.guests[d.unseat];return put('guests',d.unseat,Object.assign({},g,{table:''}));}
  const A={addGuest:()=>guestForm(),bulk:bulkForm,addVendor:()=>vendorForm(),plates:platesForm,addTask:()=>taskForm(),addTl:()=>tlForm(),addGift:()=>giftForm(),addVenue:()=>venueForm(),template:applyTemplate,csv:downloadCsv,round:()=>rsvpRound('invite'),remind:()=>rsvpRound('remind'),dayRound:()=>rsvpRound('day'),summary:venueSummary,syncForm:syncForm,importRsvp:importRsvpForm,addTable:()=>tableForm(),importWedding:importWeddingPicker,
    copyRsvp:()=>{const u=rsvpLink('');try{navigator.clipboard.writeText(u).then(()=>toast('הקישור הועתק. אפשר לשלוח בקבוצות'),()=>infoModal('קישור לאישור הגעה','<p dir="ltr" style="word-break:break-all">'+esc(u)+'</p>'));}catch(e){infoModal('קישור לאישור הגעה','<p dir="ltr" style="word-break:break-all">'+esc(u)+'</p>');}},
    copyContacts:()=>{const txt=sortedVendors().filter(([i,v])=>v.status==='booked'&&(v.name||v.phone)).map(([i,v])=>v.cat+': '+(v.name||'')+' '+(v.phone||'')).join('\n');try{navigator.clipboard.writeText(txt).then(()=>toast('הרשימה הועתקה, אפשר להדביק בוואטסאפ'),()=>toast('לא הצלחתי להעתיק'));}catch(err){toast('לא הצלחתי להעתיק');}},
    giftAvg:()=>{const s0=set();openForm('צפי מתנות',[{k:'giftAvg',label:'כמה בממוצע אורח נותן (₪)',type:'number',hint:'ממוצע לאדם, לא לזוג'}],{giftAvg:n(s0.giftAvg)||''},o=>put('settings','main',Object.assign({},s0,{giftAvg:o.giftAvg})));},addTables:addTablesForm};
  if(A[d.act])A[d.act]();
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.editTl){e.preventDefault();tlForm(e.target.dataset.editTl);}if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.editVenue){e.preventDefault();venueForm(e.target.dataset.editVenue);}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.toggleTask){const x=S.tasks[t.dataset.toggleTask];put('tasks',t.dataset.toggleTask,Object.assign({},x,{done:t.checked}));}
  else if(t.dataset.cmpf){saveCmp();}
  else if(t.dataset.cmpv){const v=S.venues[t.value];if(v){const k=t.dataset.cmpv;const a=$('#cmp_'+k+'_plate'),b=$('#cmp_'+k+'_min'),l=$('#cmp_'+k+'_label');if(a)a.value=n(v.plate)||'';if(b)b.value=n(v.min)||'';if(l)l.value=v.name;}saveCmp();cmpRefresh();}
  else if(t.dataset.thank){const x=S.gifts[t.dataset.thank];put('gifts',t.dataset.thank,Object.assign({},x,{thanked:t.checked}));}
  else if(t.id==='gSide'){ui.gSide=t.value;render();}
  else if(t.id==='gGroup'){ui.gGroup=t.value;render();}
  else if(t.id==='gSort'){ui.sort=t.value;render();}
  else if(t.dataset.seat){const g=S.guests[t.dataset.seat];if(t.value)put('guests',t.dataset.seat,Object.assign({},g,{table:t.value}));}
});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.cmpf){cmpRefresh();return;}if(e.target.id==='gq'){ui.q=e.target.value;$('#glist').innerHTML=guestListHtml();}});
document.addEventListener('submit',e=>{if(e.target.id==='qa'){e.preventDefault();quickAdd();return;}if(e.target.id==='prefsForm'){e.preventDefault();const fd=new FormData(e.target);const o=Object.assign({},set());
  for(const [k,v] of fd.entries())o[k]=['budget','platePrice','minPlates','venuePaid'].includes(k)?n(v):String(v).trim();o.est=false;
  document.activeElement&&document.activeElement.blur();put('settings','main',o);toast('נשמר');}});
function fromHash(){const h=location.hash.replace('#','');if(TABS.some(x=>x[0]===h)){ui.tab=h;render();}}
window.addEventListener('hashchange',fromHash);
const h0=location.hash.replace('#','');if(TABS.some(x=>x[0]===h0))ui.tab=h0;
init();
})();
</script>
</body></html>
