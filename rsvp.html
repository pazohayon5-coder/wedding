<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#23463A"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><script>window.WEDDING_API='https://script.google.com/macros/s/AKfycbypz0zE1dFH_nxGAANAliTT9MlAmXxu7s_r1Tjbutkw7l7dMj-40YHlWJ90P_-IdviFHg/exec';</script></head><body>
<title>אישור הגעה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Assistant:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#F5F7F3;--surface:#fff;--ink:#1D2B24;--muted:#5C6C64;--line:#DCE3DD;--accent:#2D5A49;--gold:#A57A2E;--band:#23463A;--band-ink:#F3F6F2;--good:#2B7A4B;--bad:#B0453A;--warn:#A86A12}
@media (prefers-color-scheme:dark){:root{--bg:#101714;--surface:#17211D;--ink:#E6EDE8;--muted:#9BACA3;--line:#2A3832;--accent:#86C2A6;--gold:#DDB46B;--band:#0C1411;--good:#71C694;--bad:#EA8478;--warn:#E6AE55;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Assistant",Arial,sans-serif;font-size:16px}
.hero{background:var(--band);color:var(--band-ink);text-align:center;padding:36px 16px 30px}
.hero small{letter-spacing:.08em;opacity:.75;font-weight:700}
.hero h1{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:44px;margin:6px 0}
.hero h1 span{color:var(--gold);font-weight:700}
.hero p{margin:0;opacity:.85}
main{max-width:460px;margin:-14px auto 40px;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
label{display:block;font-weight:700;font-size:14px;color:var(--muted);margin:14px 0 6px}
input,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 6px;font:inherit;font-weight:800;cursor:pointer}
.opts button.on[data-v=yes]{background:var(--good);color:#fff;border-color:var(--good)}
.opts button.on[data-v=maybe]{background:var(--warn);color:#fff;border-color:var(--warn)}
.opts button.on[data-v=no]{background:var(--bad);color:#fff;border-color:var(--bad)}
.step{display:flex;align-items:center;gap:14px}
.step button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:22px;font-weight:800;cursor:pointer}
.step b{font-size:26px;min-width:30px;text-align:center}
.send{width:100%;margin-top:20px;border:0;background:var(--accent);color:#fff;border-radius:14px;padding:14px;font:inherit;font-weight:800;font-size:18px;cursor:pointer}
.send[disabled]{opacity:.6}
.err{color:var(--bad);font-weight:700;margin-top:10px}
.thanks{text-align:center;padding:30px 10px}.thanks h2{font-family:"Frank Ruhl Libre",serif;font-size:30px;margin:0 0 8px}
[hidden]{display:none!important}
</style>
<div dir="rtl" lang="he">
  <header class="hero"><small id="kind">מתחתנים!</small><h1 id="names">אורי <span>&amp;</span> יובל</h1><p id="when"></p></header>
  <main>
    <img id="invite" hidden alt="ההזמנה" style="display:block;width:100%;border-radius:16px;margin:0 0 14px;box-shadow:0 4px 18px rgba(0,0,0,.12)">
    <form class="card" id="f">
      <div id="hello" style="font-weight:800;font-size:18px"></div>
      <label for="name">שם מלא</label><input id="name" required autocomplete="name">
      <label for="phone">טלפון</label><input id="phone" type="tel" autocomplete="tel" dir="ltr" style="text-align:right">
      <label>מגיעים?</label>
      <div class="opts"><button type="button" data-v="yes" class="on">מגיעים 🎉</button><button type="button" data-v="maybe">עוד לא בטוחים</button><button type="button" data-v="no">לא נוכל</button></div>
      <div id="cntWrap"><label>כמה אנשים?</label><div class="step"><button type="button" id="minus" aria-label="פחות">−</button><b id="cnt">1</b><button type="button" id="plus" aria-label="יותר">+</button></div></div>
      <label for="note">משהו שחשוב לדעת? (לא חובה)</label><textarea id="note" rows="2" placeholder="למשל: צמחוני, מגיעים עם תינוק"></textarea>
      <button class="send" type="submit" id="send">שליחה</button>
      <div class="err" id="err" hidden></div>
    </form>
    <div class="card thanks" id="thanks" hidden><h2>תודה!</h2><p id="thx"></p></div>
  </main>
</div>
<script>
(function(){
const API=window.WEDDING_API;const q=new URLSearchParams(location.search);const ev=['henna','shabbat'].includes(q.get('e'))?q.get('e'):'wedding';const gid=q.get('g')||'';
const KIND={wedding:'מתחתנים!',henna:'מזמינים אתכם לחינה',shabbat:'מזמינים אתכם לשבת חתן'};
let status='yes',cnt=1;const $=s=>document.querySelector(s);
$('#kind').textContent=KIND[ev];
document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{status=b.dataset.v;document.querySelectorAll('.opts button').forEach(x=>x.classList.toggle('on',x===b));$('#cntWrap').hidden=status==='no';});
$('#minus').onclick=()=>{cnt=Math.max(1,cnt-1);$('#cnt').textContent=cnt;};$('#plus').onclick=()=>{cnt=Math.min(30,cnt+1);$('#cnt').textContent=cnt;};
(function(){const im=document.getElementById('invite');im.onload=()=>{im.hidden=false;};im.onerror=()=>{im.remove();};im.src='invite'+(ev==='wedding'?'':'-'+ev)+'.jpg';})();
fetch(API+'?action=event&e='+ev+(gid?'&g='+encodeURIComponent(gid):'')).then(r=>r.json()).then(j=>{if(!j.ok)return;
  const n=document.getElementById('names');n.textContent='';n.append(j.names1+' ');const sp=document.createElement('span');sp.textContent='&';n.append(sp,' '+j.names2);
  const parts=[];if(j.date)parts.push(new Date(j.date+'T00:00:00').toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}));if(j.venue)parts.push(j.venue);$('#when').textContent=parts.join(' · ');
  document.title='אישור הגעה · '+j.names1+' ו'+j.names2;
  if(j.guest){$('#name').value=j.guest.name;$('#hello').textContent='היי '+j.guest.name+', נשמח לדעת אם תגיעו';cnt=j.guest.invited||1;$('#cnt').textContent=cnt;}
}).catch(()=>{});
$('#f').onsubmit=e=>{e.preventDefault();const b=$('#send');b.disabled=true;$('#err').hidden=true;
  fetch(API,{method:'POST',body:JSON.stringify({action:'rsvp',e:ev,g:gid,name:$('#name').value,phone:$('#phone').value,status,count:status==='no'?0:cnt,note:$('#note').value})}).then(r=>r.json()).then(j=>{
    if(!j.ok)throw 0;$('#f').hidden=true;$('#thanks').hidden=false;$('#thx').textContent=status==='yes'?'קיבלנו, מחכים לראות אתכם!':status==='no'?'תודה שעדכנתם, נתגעגע.':'תודה! אפשר לחזור לקישור הזה ולעדכן מתי שתדעו.';
  }).catch(()=>{$('#err').textContent='השליחה לא הצליחה. בדקו את האינטרנט ונסו שוב.';$('#err').hidden=false;b.disabled=false;});};
})();
</script>
</body></html>
